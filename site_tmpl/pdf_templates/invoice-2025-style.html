{% comment %}
    The 2025 invoice's look. The single-event invoice (bill-itemized-2025.html)
    and finance's multi-bill invoice both include it, so they stay alike.
{% endcomment %}<style>
        @page {
            size: letter;
            margin: .75in;
        }

        body {
            font-family: 'Helvetica-Neue', 'Sans-Serif';
        }

        td {
            padding: 2px;
        }

        table {
            width: 100%;
            border-spacing: 0;
        }

        #logo-table {
            padding-top: 35px;
        }

        #logo {
            text-align: right;
        }

        #logo-img {
            width: 120px;
        }

        #lnl-contact {
            font-size: 8pt;
            vertical-align: top;
        }

        #contact-name {
            font-size: 18pt;
            margin-top: 0;
            margin-bottom: 0;
        }

        #quote-box {
            font-size: 18pt;
            border: 1px solid black;
            display: inline-block;
            text-align: center;
            padding-left: 25px;
            padding-right: 25px;
            padding-top: 2px;
            padding-bottom: 2px;
            margin-bottom: 20px;
            background-color: #f3f3f3;
        }

        ul.list-unstyled {
            list-style-type: none;
            margin-top: 0;
            padding-top: 0;
            padding-left: 10px;
        }

        a.unstyled {
            text-decoration: none;
            color: black;
        }

        #event-info {
            font-size: 9pt;
        }

        #event-info td:nth-child(1) {
            font-weight: bold;
            text-align: right;
            padding-right: 5px;
        }

        #event-info td:nth-child(2) {
            text-align: left;
        }

        .centered {
            text-align: center;
        }

        hr.double {
            border-width: 0px;
            border-top: 1px solid black;
            border-bottom: 1px solid black;
            height: 2px;
            margin: 0;
            clear: both;
        }

        td.double {
            border-width: 0px;
            border-top: 1px solid black;
            border-bottom: 1px solid black;
            height: 0px;
            padding: 1px
        }

        #event-name {
            font-size: 18pt;
            margin: 0;
        }

        .left {
            float: left;
        }

        .right {
            float: right;
        }

        .expiry-date {
            font-size: 11pt;
            font-style: italic;
        }

        div.category-header {
            clear: both;
        }

        span.category-header {
            font-size: 14pt;
            font-weight: bold;
            padding-top: 20px;
            break-after: avoid;
        }
        
        table.category {
            break-before: avoid;
            break-inside: avoid;
        }

        table.category th {
            font-size: 8pt;
            font-weight: normal;
        }

        table.category td {
            font-size: 10pt;
        }
        
        table.category th:nth-child(1) {
            width: 10%;
        }

        table.category th:nth-child(2) {
            width: 55%;
        }

        table.category th:nth-child(3) {
            width: 20%;
        }

        table.category th:nth-child(4) {
            width: 15%;
        }

        table.category th:nth-child(1),
        table.category td:nth-child(1) {
            text-align: center;
        }

        table.category td:nth-child(3),
        table.category th:nth-child(3) {
            text-align: right;
        }

        table.category td:nth-child(4),
        table.category th:nth-child(4) {
            text-align: right;
            padding-right: 5px;
        }
        
        table.category tr:nth-child(2n+4) {
            background-color: #f3f3f3;
        }
        
        div.grand-total {
            clear: both;
            border-top: 2px solid black;
            border-bottom: 2px solid black;
            margin-top: 10px;
            overflow: hidden;
        }

        span.grand-total {
            font-size: 14pt;
            font-weight: bold;
        }

        .disclaimer {
            font-size: 8pt;
            text-align: center;
        }

        div.sga-funded {
            margin-top: 10px;
            font-size: 14px;
            font-style: italic;
            text-align: right;
            color: green;
        }

        tr.sga-funded {
            font-style: italic;
            color: green;
        }
    </style>
